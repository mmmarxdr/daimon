<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Daimon — Memory (Liminal)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #efece5; }
    * { box-sizing: border-box; }
    input, button, select { font-family: inherit; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Dependencies: design canvas, chat mocks (for the sidebar glyph + tokens), liminal system, memory mocks, memory screen -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="chat-mocks.jsx"></script>
  <script type="text/babel" src="liminal.jsx"></script>
  <script type="text/babel" src="memory-mocks.jsx"></script>
  <script type="text/babel" src="memory.jsx"></script>

  <script type="text/babel">
    const TWEAKS = /*EDITMODE-BEGIN*/{
      "density": "sparse",
      "layout": "list",
      "showTrust": true,
      "editorial": true
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweaks] = React.useState(TWEAKS);
      const [editMode, setEditMode] = React.useState(false);

      // Tweak protocol
      React.useEffect(() => {
        const onMsg = (e) => {
          if (!e.data || typeof e.data !== 'object') return;
          if (e.data.type === '__activate_edit_mode') setEditMode(true);
          if (e.data.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const updateTweak = (k, v) => {
        const next = { ...tweaks, [k]: v };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      };

      return (
        <>
          <MemoryStyles />
          <DesignCanvas>
            <DCSection
              title="Daimon · Memory"
              subtitle="Dos superficies en una pantalla: memoria de largo plazo (lo que Daimon ha aprendido por observación) + conocimiento (archivos que le diste, ingeridos a markdown e inyectables en contexto). Voz editorial fuerte — Daimon habla de sus recuerdos en primera persona.">

              <DCArtboard label="Light — what I remember of you" width={1400} height={960}>
                <DaimonMemory theme={LIMINAL_TOKENS.light} isDark={false} tweaks={tweaks} />
              </DCArtboard>

              <DCArtboard label="Dark — what I remember of you" width={1400} height={960}>
                <DaimonMemory theme={LIMINAL_TOKENS.dark} isDark={true} tweaks={tweaks} />
              </DCArtboard>

              <DCPostIt top={-40} left={1440} rotate={-2.5} width={270}>
                <b>Tres señales de confianza</b><br/><br/>
                Cada memoria lleva:<br/>
                <span style={{color:'#1f6357'}}>● I know</span> — certeza, confirmado muchas veces<br/>
                <span style={{color:'#b87a2e'}}>◐ I infer</span> — patrón observado<br/>
                <span style={{color:'#8a8275'}}>○ I assume</span> — apuesta suave, corregible<br/><br/>
                Color + glifo + italic serif. Redundante a propósito — la confianza debe ser ilegible de ignorar.
              </DCPostIt>

              <DCPostIt top={260} left={1440} rotate={1.5} width={270}>
                <b>Voz editorial</b><br/><br/>
                "what I remember of you" en Fraunces italic — Daimon se presenta como alguien que te recuerda, no como una base de datos.<br/><br/>
                Clusters narrados: "Projects <i style={{fontFamily:'Fraunces',fontStyle:'italic'}}>— what we are building together</i>".
              </DCPostIt>

              <DCPostIt top={560} left={1440} rotate={-1} width={270}>
                <b>Corregir, no sólo borrar</b><br/><br/>
                Menú por tarjeta: <b>Edit</b>, <b>Pin</b>, <b>Trace origin</b>, y el clave: <b>"That's not right"</b> que cuarentena la memoria.<br/><br/>
                Tras cuarentena: <i style={{fontFamily:'Fraunces',fontStyle:'italic'}}>"I'll forget this. Next time it comes up, I'll ask."</i>
              </DCPostIt>

              <DCPostIt top={830} left={120} rotate={2} width={280}>
                <b>Knowledge es distinto</b><br/><br/>
                Tab separada. Muestra el archivo original, tamaño, chunks RAG, veces inyectado al contexto. Estado <i style={{color:'#b87a2e',fontFamily:'Fraunces',fontStyle:'italic'}}>indexing</i> animado mientras Daimon ingiere.
              </DCPostIt>

              <DCPostIt top={830} left={1720} rotate={-1.5} width={280}>
                <b>Filtros por confianza</b><br/><br/>
                La acción principal — "editar/borrar para corregir malentendidos" — empieza filtrando por <span style={{color:'#b87a2e'}}>inferred</span> y <span style={{color:'#8a8275'}}>assumed</span>. Ahí es donde Daimon más puede equivocarse.
              </DCPostIt>
            </DCSection>

            <div style={{ padding: '0 60px 60px', maxWidth: 1400, margin: '0 auto' }}>
              <div style={{
                display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24,
                fontFamily: 'Inter, system-ui, sans-serif', color: 'rgba(40,30,20,0.82)',
              }}>
                <div style={{
                  padding: 22, background: '#faf6ee',
                  border: '1px solid rgba(0,0,0,0.08)', borderRadius: 6,
                  fontSize: 13.5, lineHeight: 1.65,
                }}>
                  <div style={{ fontWeight: 600, marginBottom: 10, fontSize: 14 }}>Jerarquía de la pantalla</div>
                  <ol style={{ margin: 0, paddingLeft: 20 }}>
                    <li><b>Preamble editorial</b> — "what I remember of you", con recuento narrativo ("X I know, Y I infer, Z I merely assume").</li>
                    <li><b>Tabs</b> — Memory ↔ Knowledge. Ambos son memoria, pero de naturaleza distinta.</li>
                    <li><b>Toolbar</b> — búsqueda semántica, filtros por confianza, orden (cluster default).</li>
                    <li><b>Clusters</b> — Identity, Preferences, Projects, Relationships, Technical. Headers en Fraunces con subtítulo italic.</li>
                    <li><b>Cards</b> — fact vs. note diferenciados, trust pill visible, source ref, last-seen, menú contextual.</li>
                  </ol>
                </div>
                <div style={{
                  padding: 22, background: '#faf6ee',
                  border: '1px solid rgba(0,0,0,0.08)', borderRadius: 6,
                  fontSize: 13.5, lineHeight: 1.65,
                }}>
                  <div style={{ fontWeight: 600, marginBottom: 10, fontSize: 14 }}>Decisiones clave</div>
                  <ul style={{ margin: 0, paddingLeft: 18 }}>
                    <li><b>Mixto, no único:</b> facts atómicos + notes narrativas como tipos distintos. El label uppercase mono los distingue.</li>
                    <li><b>Tags auto + clusters fijos:</b> agrupación por cluster para estructura, tags para búsqueda rápida.</li>
                    <li><b>Confianza redundante:</b> color + dots + italic serif. Los assumed son visualmente más apagados — invitan a corregirse.</li>
                    <li><b>Quarantine, no delete:</b> "that's not right" marca la memoria para olvido, no la destruye inmediatamente. Undo disponible.</li>
                    <li><b>Knowledge RAG visible:</b> chunks, injection count, estado indexing. Hace explícito el sistema.</li>
                  </ul>
                </div>
              </div>

              <div style={{
                marginTop: 24, padding: 22, background: '#faf6ee',
                border: '1px solid rgba(0,0,0,0.08)', borderRadius: 6,
                fontSize: 13, color: 'rgba(40,30,20,0.7)', lineHeight: 1.6,
                fontFamily: 'Inter, system-ui, sans-serif',
              }}>
                <b>Cosas que quedan fuera (por ahora)</b> — vista detalle de un knowledge (preview del markdown, ver chunks individuales), búsqueda semántica real sobre memorias + knowledge simultánea, merge de memorias duplicadas, export a markdown. Activa Tweaks arriba para cambiar densidad, layout, voz editorial, o el trust surface.
              </div>
            </div>
          </DesignCanvas>

          {editMode && <TweaksPanel tweaks={tweaks} setTweak={updateTweak} />}
        </>
      );
    }

    // ── Tweaks panel
    function TweaksPanel({ tweaks, setTweak }) {
      const bg = '#1a1813', ink = '#eae5d8', mut = '#8a8275', accent = '#5dbfa7', line = 'rgba(234,229,216,0.1)';
      return (
        <div style={{
          position: 'fixed', bottom: 20, right: 20, width: 260,
          background: bg, color: ink, borderRadius: 8,
          border: `1px solid ${line}`, padding: 14,
          fontFamily: '"Inter", system-ui, sans-serif', fontSize: 12,
          boxShadow: '0 20px 50px rgba(0,0,0,0.35)',
          zIndex: 1000,
        }}>
          <div style={{
            fontFamily: '"Fraunces", serif', fontStyle: 'italic', fontSize: 14,
            color: accent, marginBottom: 2,
          }}>Tweaks</div>
          <div style={{ fontSize: 10.5, color: mut, marginBottom: 14 }}>Memory direction</div>

          <TweakRow label="Density">
            {['sparse', 'normal', 'dense'].map(v => (
              <TweakChip key={v} on={tweaks.density === v} onClick={() => setTweak('density', v)}>{v}</TweakChip>
            ))}
          </TweakRow>

          <TweakRow label="Layout">
            {['grid', 'list', 'reading'].map(v => (
              <TweakChip key={v} on={tweaks.layout === v} onClick={() => setTweak('layout', v)}>{v}</TweakChip>
            ))}
          </TweakRow>

          <TweakRow label="Trust surface">
            <TweakChip on={tweaks.showTrust} onClick={() => setTweak('showTrust', !tweaks.showTrust)}>
              {tweaks.showTrust ? 'shown' : 'hidden'}
            </TweakChip>
          </TweakRow>

          <TweakRow label="Editorial voice">
            <TweakChip on={tweaks.editorial} onClick={() => setTweak('editorial', !tweaks.editorial)}>
              {tweaks.editorial ? 'strong' : 'off'}
            </TweakChip>
          </TweakRow>
        </div>
      );
    }

    function TweakRow({ label, children }) {
      return (
        <div style={{ marginBottom: 10 }}>
          <div style={{
            fontSize: 10, color: '#8a8275', marginBottom: 5,
            textTransform: 'uppercase', letterSpacing: 0.7,
            fontFamily: '"JetBrains Mono", monospace',
          }}>{label}</div>
          <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>{children}</div>
        </div>
      );
    }

    function TweakChip({ on, onClick, children }) {
      return (
        <button onClick={onClick} style={{
          padding: '4px 10px', borderRadius: 4,
          fontSize: 11, cursor: 'pointer',
          background: on ? 'rgba(93,191,167,0.18)' : 'transparent',
          color: on ? '#5dbfa7' : '#c2bca9',
          border: `1px solid ${on ? '#5dbfa755' : 'rgba(234,229,216,0.12)'}`,
          fontFamily: 'inherit',
        }}>{children}</button>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
